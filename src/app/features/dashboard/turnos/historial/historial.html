<section class="mx-auto max-w-3xl px-4 sm:px-6 py-10 sm:py-14">
  <p class="font-data text-xs uppercase tracking-[0.2em] text-steel">Turnos</p>
  <h1 class="mt-3 font-display text-3xl sm:text-display font-bold tracking-tight text-asphalt">Mi historial</h1>

  <ul class="mt-8 divide-y divide-steel/20 rounded-sm border border-steel/25 bg-spec-paper">
    @for (turno of turnos(); track turno.id) {
      <li>
        <a
          [routerLink]="['/dashboard/turnos', turno.id]"
          class="flex items-center justify-between gap-3 px-4 py-3.5 transition-colors hover:bg-signal-amber/10"
        >
          <div>
            <p class="font-data text-sm font-medium text-asphalt">{{ turno.codigo }}</p>
            <p class="mt-0.5 text-xs text-steel">{{ turno.creadoEn.toDate() | date: 'd MMM, HH:mm' }}</p>
          </div>
          <span
            class="shrink-0 rounded-sm border px-2 py-1 font-data text-[0.6875rem] uppercase tracking-wider"
            [class]="claseEstado(turno.estado)"
          >{{ turno.estado }}</span>
        </a>
      </li>
    } @empty {
      <li class="px-4 py-8 text-center text-sm text-steel">Todavía no has pedido ningún turno.</li>
    }
  </ul>
</section>
